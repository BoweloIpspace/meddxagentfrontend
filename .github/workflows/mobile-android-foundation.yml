name: Mobile Android foundation

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/mobile-android-foundation.yml'
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/mobile-android-foundation.yml'
  workflow_dispatch:

jobs:
  android-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build unchanged web application
        run: npm run build

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci

      - name: Audit mobile dependencies for high-severity vulnerabilities
        working-directory: mobile
        run: npm audit --audit-level=high

      - name: Verify Android permission allowlist
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = ET.parse(Path('mobile/android/app/src/main/AndroidManifest.xml')).getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          permissions = {
              node.attrib[f'{android}name']
              for node in manifest.findall('uses-permission')
          }
          expected = {'android.permission.INTERNET'}
          assert permissions == expected, f'Unexpected Android permissions: {sorted(permissions)}'
          PY

      - name: Prepare native-only assets
        working-directory: mobile
        run: npm run native:prepare

      - name: Sync native assets into Android
        working-directory: mobile
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Android unit tests
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest

      - name: Compile MEDDxAgent instrumentation tests
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebugAndroidTest

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Verify incomplete release signing config is rejected
        working-directory: mobile/android
        run: |
          if MEDDX_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/incomplete.keystore" ./gradlew :app:tasks >/dev/null 2>&1; then
            echo "Incomplete Android signing configuration was unexpectedly accepted"
            exit 1
          fi

      - name: Create ephemeral CI release keystore
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/meddxagent-ci.keystore" \
            -storepass ci-release-password \
            -keypass ci-release-password \
            -alias meddxagent-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=MEDDxAgent CI, OU=CI, O=MEDDxAgent, L=CI, ST=CI, C=US"

      - name: Build signed release AAB with CI version overrides
        working-directory: mobile/android
        env:
          MEDDX_ANDROID_VERSION_CODE: '1000001'
          MEDDX_ANDROID_VERSION_NAME: '1.0.0-ci'
          MEDDX_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/meddxagent-ci.keystore
          MEDDX_ANDROID_KEYSTORE_PASSWORD: ci-release-password
          MEDDX_ANDROID_KEY_ALIAS: meddxagent-ci
          MEDDX_ANDROID_KEY_PASSWORD: ci-release-password
        run: ./gradlew bundleRelease

      - name: Verify release AAB signature
        run: jarsigner -verify mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meddxagent-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload CI-signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: meddxagent-release-aab-ci-signed
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3
