name: Mobile Android foundation

on:
  push:
    branches:
      - agent/capacitor-android-foundation
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-foundation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build unchanged web application
        run: npm run build

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android platform when absent
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web build into Android
        working-directory: mobile
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Commit generated native source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json mobile/android
          if ! git diff --cached --quiet; then
            git commit -m "Commit generated Capacitor Android project"
            git push
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meddxagent-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
