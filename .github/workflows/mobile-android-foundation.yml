name: Mobile Android foundation

on:
  push:
    branches:
      - agent/capacitor-android-foundation
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-foundation.yml'
  workflow_dispatch:

jobs:
  android-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build unchanged web application
        run: npm run build

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Sync web build into Android
        working-directory: mobile
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload generated Android source
        uses: actions/upload-artifact@v4
        with:
          name: meddxagent-android-foundation
          path: |
            mobile/android
            mobile/package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meddxagent-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
